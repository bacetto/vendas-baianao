<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="dados" content="https://raw.githubusercontent.com/bacetto/vendas-baianao/dados/dados.enc,https://raw.githubusercontent.com/bacetto/vendas-baianao/main/dados.enc">
<meta name="chat" content="https://painel-baianao-chat.gabriel-bacetto.workers.dev">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="https://baianao.com.br/cdn/shop/files/logo_d4a14027-c809-4795-88f1-a011c0050bb3.png?v=1746454030">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Painel de Gestão à Vista · Baianão (nova versão)</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#12172b;--mut:#6b7285;--line:#e4e6ee;--navy:#00388a;--red:#e3262b;--ok:#0e9f6e;--bad:#d63b3b;--warn:#c98a00;--soft:#eef0f7;--meta:#1e88e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:14px 18px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-14px -18px 14px;padding:12px 18px;background:#fff;border-bottom:4px solid var(--red);box-shadow:0 2px 10px #0001}
.marca{height:44px;width:auto;display:block;flex:none}
header .sep{width:1px;height:36px;background:var(--line);flex:none}
.logo{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:22px;border-bottom:4px solid var(--red)}
h1{font-size:18px;margin:0;font-weight:700;color:var(--navy)}
.quando{font-size:20px;font-weight:700;color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:none;padding:7px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;text-transform:capitalize}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff}
.vivo{color:var(--mut);font-size:13px}.vivo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.vivo.velho i{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.hero{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:14px}
.sub{color:var(--mut);font-size:13px}
.big{font-size:54px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:4px 0 8px}
.big small{font-size:24px;font-weight:700;margin-right:6px;letter-spacing:0}
.linha{margin:5px 0;color:var(--mut)}.linha b{color:var(--ink)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.barra{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 4px}.barra i{display:block;height:100%;background:var(--navy);border-radius:9px}
.dest{font-size:17px;margin-top:10px}.dest b{color:var(--ok)}
.grid{display:grid;gap:12px;margin-top:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.reg{cursor:pointer;border-top:3px solid var(--navy);transition:box-shadow .15s}
.reg:hover{box-shadow:0 2px 10px #14246b22}.reg.on{outline:2px solid var(--navy)}
.reg h3{margin:0;font-size:13px;font-weight:700}.reg .v{font-size:24px;font-weight:800;margin:4px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cat .n{font-size:12px;color:var(--mut)}.cat .v{font-weight:800;font-size:16px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini div b{display:block;font-size:17px}
.sec{margin-top:16px}
.ferr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{min-width:230px}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#f8f9fc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);cursor:pointer;user-select:none;z-index:1}
th.s::after{content:" ↓"}th.s.asc::after{content:" ↑"}
td.l,th.l{text-align:left}td.nome{white-space:normal;min-width:180px;font-weight:600}
tr:hover td{background:#fafbff}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--soft);font-size:11px;font-weight:700;color:var(--navy)}
.pb{display:inline-block;width:70px;height:6px;background:var(--soft);border-radius:6px;vertical-align:middle;margin-right:6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:6px}
.rk{color:var(--mut);width:34px}
.nota{color:var(--mut);font-size:12px;margin-top:8px}
svg text{font:11px system-ui,sans-serif;fill:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);align-items:center}
.leg i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--navy);vertical-align:middle;margin-right:5px}.leg i.d{border-top:2px dashed #9aa1b5}.leg i.m{border-top-color:var(--meta)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 9px;border-radius:7px;font-size:12px;display:none;z-index:9}
.secs button{text-transform:none}.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap}.secs button.on{background:var(--navy)}
.kpi .kv{font-size:28px;font-weight:900;letter-spacing:-.5px;margin:4px 0}
.ia{border:1px solid #c9d2f5;background:linear-gradient(135deg,#f5f7ff,#fff 60%)}.ia p{margin:8px 0 0;font-size:15px;line-height:1.55}.iat{font-weight:800;font-size:15px}
.alertas{display:flex;flex-direction:column;gap:8px;margin-top:10px}.al{border-left:4px solid var(--line);padding:6px 10px;background:#fafbfe;border-radius:6px}
.iam{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.3px}.iagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.ialst{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ialst ul{margin:6px 0 0;padding-left:18px}.ialst li{margin:4px 0}
.ialst.ok{border-top:3px solid var(--ok)}.ialst.at{border-top:3px solid var(--warn)}.ialst.ac{border-top:3px solid var(--navy)}
@media(max-width:900px){.iagrid{grid-template-columns:1fr}}
#chatBtn{position:fixed;right:22px;bottom:22px;z-index:20;border:0;border-radius:30px;padding:13px 20px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#14246b,#4f46e5);box-shadow:0 8px 24px #14246b55;cursor:pointer}
#chat{position:fixed;right:22px;bottom:84px;width:min(440px,calc(100vw - 30px));height:min(640px,calc(100vh - 120px));z-index:21;display:none;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #12172b40;overflow:hidden}
#chat.on{display:flex}#chat header{border-bottom:0;box-shadow:none;margin:0;padding:12px 16px;background:linear-gradient(135deg,#14246b,#4f46e5);color:#fff;display:flex;justify-content:space-between;align-items:center}
#chat header b{font-size:15px}#chat header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f7f8fc}
.m{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.45;font-size:14px;white-space:normal}.m ul{margin:4px 0;padding-left:18px}
.m.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.a .mod{display:block;margin-top:6px;font-size:11px;color:var(--mut)}.m.p{color:var(--mut);font-style:italic}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug button{border:1px solid #c9d2f5;background:#fff;color:var(--navy);border-radius:16px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
#chatF{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}#chatF input{flex:1}#chatF button{border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.btia{margin-left:10px;border:0;border-radius:16px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#14246b,#4f46e5);cursor:pointer}.btia:disabled{opacity:.6;cursor:wait}
.al.alto{border-left-color:var(--bad)}.al.medio{border-left-color:var(--warn)}.al.bom{border-left-color:var(--ok)}.al .sub{margin-top:3px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.big{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img class="marca" src="https://baianao.com.br/cdn/shop/files/logo_d4a14027-c809-4795-88f1-a011c0050bb3.png?v=1746454030" alt="Baianão"><div class="sep"></div><h1>Painel de Gestão à Vista</h1><span class="quando" id="quando"></span>
  <div class="tabs secs" id="secs"></div>
  <div class="tabs" id="tabsP"></div>
  <span class="vivo" id="vivo"></span>
</header>
<div id="app"><div class="card">Carregando dados…</div></div>
</div>
<div id="tip"></div>
<button id="chatBtn" style="display:none">✨ Pergunte ao painel</button>
<div id="chat"><header><b>✨ Pergunte ao painel</b><button id="chatX" title="Fechar">×</button></header><div id="msgs"></div>
<form id="chatF"><input id="chatI" placeholder="Ex.: quais lojas da R2 estão mais atrás no mês?" autocomplete="off"><button>Enviar</button></form></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const brl=(v,d=0)=>(v<0?"-":"")+"R$ "+Math.abs(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const mil=v=>Math.abs(v)>=1e6?"R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi":Math.abs(v)>=1e3?"R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":brl(v);
const num=v=>(v||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
// % de um serviço sobre a venda (Sorte, Garantia, Pacote)
const pServ=(v,venda)=>venda>0?`<span style="display:block;font-size:12px;font-weight:600;color:var(--muted,#6b7280);margin-top:2px">${((v||0)/venda*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}% das vendas</span>`:"";
const pct=(v,d=1)=>((v||0)*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const delta=(a,b)=>{if(!b)return"";const d=a/b-1;return `<span class="${d>=0?"up":"down"}">${d>=0?"↑ +":"↓ "}${pct(d)}</span>`};
const cor=p=>p>=1?"var(--ok)":p>=.8?"var(--warn)":"var(--bad)";
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
let D=null,S={per:"hoje",aba:"loja",reg:"",loja:"",q:"",sort:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("painel-baianao")||"{}"),{q:""})}catch(e){}
const salva=()=>{try{localStorage.setItem("painel-baianao",JSON.stringify({per:S.per,aba:S.aba,sec:S.sec}))}catch(e){}};
const nomeLoja=c=>{const l=D.lojas[c];return l?`${String(l.num).padStart(2,"0")} · ${l.nome||"Loja "+l.num}`:c};
const regLoja=c=>D.lojas[c]?.regional||"Sem regional";

const DADOS_URL=(document.querySelector('meta[name="dados"]')||{}).content||"";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abre(enc,senha){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const zip=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},k,b64(enc.dados));
  const txt=await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
function pedeSenha(enc,erro){
  $("#app").innerHTML=`<div class="card" style="max-width:380px;margin:60px auto;text-align:center"><img class="marca" style="height:52px;margin:0 auto 14px" src="https://baianao.com.br/cdn/shop/files/logo_d4a14027-c809-4795-88f1-a011c0050bb3.png?v=1746454030" alt="Baianão"><b style="font-size:17px">Painel de vendas</b><p class="sub">Acesso restrito. Digite a senha.</p>
  <form id="fS"><input type="password" id="iS" placeholder="Senha" autofocus style="width:100%;margin-bottom:10px"><button style="width:100%;padding:9px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer">Entrar</button></form>
  <p class="down" style="min-height:18px">${erro?"Senha incorreta.":""}</p></div>`;
  $("#fS").onsubmit=async e=>{e.preventDefault();const s=$("#iS").value;try{D=await abre(enc,s);try{localStorage.setItem("painel-baianao-s",s)}catch(x){}render()}catch(x){pedeSenha(enc,true)}};
}
async function carrega(){
  try{const r=await fetch("dados.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();render();return}catch(e){}
  try{let enc=null;
    // versão mais nova sem esperar o cache de 5 min: pega o commit atual do ramo "dados" e baixa por ele
    try{const c=await fetch("https://api.github.com/repos/bacetto/vendas-baianao/commits/dados",{cache:"no-cache",headers:{Accept:"application/vnd.github+json"}});
      if(c.ok){const sha=(await c.json()).sha;if(sha&&sha===window.__sha&&D)return;const r=await fetch(`https://raw.githubusercontent.com/bacetto/vendas-baianao/${sha}/dados.enc`);if(r.ok){enc=await r.json();window.__sha=sha}}}catch(x){}
    for(const u of enc?[]:[...DADOS_URL.split(",").map(x=>x.trim()).filter(Boolean),"dados.enc"]){if(!u)continue;try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(r.ok){enc=await r.json();break}}catch(x){}}if(!enc)throw 0;let s="";try{s=localStorage.getItem("painel-baianao-s")||""}catch(x){}
    if(s){try{D=await abre(enc,s);render();return}catch(x){}}
    if(!D)pedeSenha(enc)}
  catch(e){if(!D)$("#app").innerHTML='<div class="card">Ainda sem dados. A primeira coleta do portal está a caminho.</div>'}
}
function cabecalho(){
  const g=new Date(D.geradoEm),loc=new Date(g.getTime()-3*3600e3);
  const hh=String(loc.getUTCHours()).padStart(2,"0")+":"+String(loc.getUTCMinutes()).padStart(2,"0");
  $("#quando").textContent=`${DIAS[loc.getUTCDay()]} ${String(loc.getUTCDate()).padStart(2,"0")}/${String(loc.getUTCMonth()+1).padStart(2,"0")} · ${hh}`;
  const min=Math.round((Date.now()-g)/6e4);
  const hojeLoc=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),diaDados=loc.toISOString().slice(0,10);
  const outroDia=hojeLoc!==diaDados;
  $("#vivo").className="vivo"+(min>45?" velho":"");
  $("#vivo").innerHTML=outroDia?`<i></i><b style="color:var(--warn)">dados de ${String(loc.getUTCDate()).padStart(2,"0")}/${String(loc.getUTCMonth()+1).padStart(2,"0")} às ${hh}</b> · a leitura do dia começa às 7h`:`<i></i>${min>45?"última leitura":"ao vivo"} · dados de ${hh}`+(min>45?` (há ${min>=120?Math.round(min/60)+" h":min+" min"})`:"");
  const P=D.periodos;
  $("#tabsP").innerHTML=["hoje","ontem","mes","mesAnt"].map(k=>`<button data-p="${k}" class="${S.per===k?"on":""}">${k==="mes"?"Mês até ontem":P[k].label}</button>`).join("")+
    (D.regionaisComparativo?`<button data-p="regionais" class="${S.per==="regionais"?"on":""}">Regionais</button>`:"");
  $("#tabsP").onclick=e=>{const p=e.target.dataset.p;if(p){S.per=p;S.sort={};salva();render()}};
}
function diasHist(){return Object.keys(D.historicoHoras||{}).filter(k=>(D.historicoHoras[k]||[]).length).sort().reverse()}
function mesAntDe(dia){const [y,m,d]=dia.split("-").map(Number);const dt=new Date(Date.UTC(y,m-2,1));const ult=new Date(Date.UTC(y,m-1,0)).getUTCDate();return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(Math.min(d,ult)).padStart(2,"0")}`}
function metaDoDia(dia,reg){const M=(reg?D.diario.porRegional?.[reg]?.meta:D.diario.metaAtual)||[];if(!M.length||dia.slice(0,7)!==D.periodos.mes.inicio.slice(0,7))return 0;const i=Number(dia.slice(8))-1;return (M[i]||0)-(i?M[i-1]||0:0)}
const fmtH=m=>`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`;
function colReg(reg){return reg?1+Number(reg.slice(1)):1}
function graficoDia(dia,reg,nome){
  const H0=420,H1=1320,W=900,H=250,L=52,R=78,T=14,Bm=26,hist=D.historicoHoras||{};
  const k=colReg(reg),A=(hist[dia]||[]).map(p=>[p[0],p[k]||0]),ant=mesAntDe(dia),B=(hist[ant]||[]).map(p=>[p[0],p[k]||0]),md=metaDoDia(dia,reg);
  // meta do dia distribuída por igual das 8h às 20h
  const Mt=md?[[H0,0],[480,0],[1200,md],[H1,md]]:[];
  const max=Math.max(...A.map(p=>p[1]),...B.map(p=>p[1]),md,1)*1.1;
  const x=m=>L+(W-L-R)*((Math.min(H1,Math.max(H0,m))-H0)/(H1-H0)),y=v=>T+(H-T-Bm)*(1-v/max);
  const path=arr=>arr.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const passo=max>6e5?1e5:max>3e5?5e4:max>1.2e5?25e3:1e4;let grade="";
  for(let v=0;v<=max;v+=passo)grade+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e9ebf2"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v/1e3).toLocaleString("pt-BR")}</text>`;
  let eixo="";for(let h=7;h<=22;h++)eixo+=`<text x="${x(h*60)}" y="${H-6}" text-anchor="middle">${h}h</text>`;
  const u=A[A.length-1],dd=s=>s.slice(8)+"/"+s.slice(5,7),q=md&&u?u[1]/md:0;
  const ehHoje=dia===D.periodos.hoje.inicio;
  return `<b>${ehHoje?"Hoje":dd(dia)} hora a hora · ${nome||"todas as lojas"}${md&&u?` <span style="font-weight:600;color:${cor(q)}">· ${pct(q)} da meta do dia</span>`:""}</b>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px">${grade}${eixo}
  ${B.length?`<path d="${path(B)}" fill="none" stroke="#9aa1b5" stroke-width="2" stroke-dasharray="5 4"/><text x="${x(B[B.length-1][0])+6}" y="${y(B[B.length-1][1])-6}">${dd(ant)} · ${mil(B[B.length-1][1])}</text>`:""}
  ${Mt.length?`<path d="${path(Mt)}" fill="none" stroke="var(--meta)" stroke-width="2.5"/><text x="${W-R+6}" y="${y(md)-4}" style="fill:var(--meta)">meta do dia</text><text x="${W-R+6}" y="${y(md)+10}" style="font-weight:700;fill:var(--meta)">${mil(md)}</text>`:""}
  ${A.length?`<path d="${path(A)}" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(u[0])}" cy="${y(u[1])}" r="5" fill="var(--red)" stroke="#fff" stroke-width="2"/>
  <text x="${x(u[0])+9}" y="${y(u[1])+14}" style="font-weight:700;fill:var(--ink)">${fmtH(u[0])} · ${mil(u[1])}</text>`:""}
  <rect class="grafHitDia" data-dia="${dia}" data-reg="${reg||""}" data-nome="${esc(nome||"")}" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-Bm}" fill="transparent"/></svg>

// ---------- aba Regionais: visão geral de cada regional ----------
const REGS=()=>(D.periodos.mes.resumo?.regionais||[]).map(r=>r.reg);
const lojasDaReg=(reg,k)=>(D.periodos[k].resumo?.lojas||[]).filter(l=>regLoja(l.cod)===reg);
const zepLoja=(k)=>{const m={};for(const l of D.zep?.periodos?.[k]?.lojas||[])m[l.cod]=l.venda;return m};
function regInfo(reg){
  prepararMesF();const P=D.periodos,rH=P.hoje.resumo?.regionais?.find(x=>x.reg===reg)||{},rM=P.mesF.resumo?.regionais?.find(x=>x.reg===reg)||{},rO=P.ontem.resumo?.regionais?.find(x=>x.reg===reg)||{};
  const zH=regZep("hoje")[reg]||0,zM=regZep("mesF")[reg]||0,rc=D.regionaisComparativo?.regionais?.find(x=>x.reg===reg)||{};
  return {reg,lider:rM.lider||rH.lider||"",hoje:rH,mes:rM,ontem:rO,zH,zM,rc,ant:P.mesF.ant.reg[reg]||0,pr:projecao(reg)};
}
function alertasReg(reg){
  const A=[],P=D.periodos,d=hoje(),mm=minutoAgora();
  const h=P.hoje.resumo?.regionais?.find(x=>x.reg===reg),fx=fracaoDoDia(mm,colReg(reg));
  if(h&&h.meta&&fx&&fx>.05&&mm>=10*60&&mm<=21*60){const r=h.venda/(h.meta*fx);A.push({nivel:r<.85?"alto":r<1?"medio":"bom",t:`Hoje a ${reg} está em <b>${fmtPct(r)}</b> do que costuma ter vendido até ${fmtH(mm)}`,d:`Vendido ${mil(h.venda)}; esperado pra este horário ${mil(h.meta*fx)}.`})}
  const pr=projecao(reg);if(pr&&pr.pctProj!=null)A.push({nivel:pr.pctProj<.95?"alto":pr.pctProj<1?"medio":"bom",t:`Projeção do mês: <b>${mil(pr.proj)}</b> (${fmtPct(pr.pctProj)} da meta de ${mil(pr.metaMes)})`,d:`Precisa de <b>${mil(pr.porDia)}/dia</b> nos ${pr.diasRest} dias que faltam. Últimos 7 dias: ${fmtPct(pr.efic)} da meta diária.`});
  const lj=lojasDaReg(reg,"mesF").filter(l=>l.meta>0);
  const piores=lj.filter(l=>l.pct<.75).sort((a,b)=>a.pct-b.pct);if(piores.length)A.push({nivel:"alto",t:`${piores.length} loja${piores.length>1?"s":""} abaixo de 75% da meta no mês (até ontem)`,d:piores.map(l=>`${esc(nomeLoja(l.cod))} <b style="color:var(--bad)">${fmtPct(l.pct)}</b>`).join(" · ")});
  const boas=lj.filter(l=>l.pct>=.95).sort((a,b)=>b.pct-a.pct);if(boas.length)A.push({nivel:"bom",t:`${boas.length} loja${boas.length>1?"s":""} no ritmo da meta até ontem (95% ou mais)`,d:boas.map(l=>`${esc(nomeLoja(l.cod))} <b style="color:var(--ok)">${fmtPct(l.pct)}</b>`).join(" · ")});
  const hj=lojasDaReg(reg,"hoje").filter(l=>l.meta>0&&mm>=12*60),fr=fracaoDoDia(mm);
  if(fr){const fracas=hj.filter(l=>l.venda/(l.meta*fr)<.5).sort((a,b)=>a.venda/a.meta-b.venda/b.meta);if(fracas.length)A.push({nivel:"medio",t:`${fracas.length} loja${fracas.length>1?"s":""} com o dia fraco até agora`,d:fracas.map(l=>`${esc(nomeLoja(l.cod))} ${mil(l.venda)} (${fmtPct(l.pct)} da meta do dia)`).join(" · ")})}
  const mg=P.mesF.resumo?.geral?.margem;if(mg){const b=lj.filter(l=>l.venda>50000&&l.margem<mg-.06);if(b.length)A.push({nivel:"medio",t:`Margem baixa (rede: ${pct(mg)})`,d:b.map(l=>`${esc(nomeLoja(l.cod))} ${pct(l.margem)}`).join(" · ")})}
  const cods=new Set(lj.map(l=>l.cod));const dv=(P.mesF.vendedores||[]).filter(v=>cods.has(v.loja)&&v.venda>30000&&-v.devol/v.venda>.2);
  if(dv.length)A.push({nivel:"medio",t:`${dv.length} vendedor${dv.length>1?"es":""} com devolução acima de 20%`,d:dv.slice(0,6).map(v=>`${esc(v.nome)} (${esc(nomeLoja(v.loja))}) ${fmtPct(-v.devol/v.venda)}`).join(" · ")});
  const ordem={alto:0,medio:1,bom:2};return A.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}
function resumoReg(i){
  const f=[],lj=lojasDaReg(i.reg,"mesF").filter(l=>l.meta>0).sort((a,b)=>b.pct-a.pct),lh=lojasDaReg(i.reg,"hoje").filter(l=>l.venda>0).sort((a,b)=>b.venda-a.venda);
  if(i.hoje.meta)f.push(`Hoje a <b>${i.reg} · ${esc(i.lider)}</b> vendeu <b>${mil((i.hoje.venda||0)+i.zH)}</b>${i.zH?` (Universo ${mil(i.hoje.venda)} + BaianãoEletro ${mil(i.zH)})`:""}, ${fmtPct(i.hoje.pct)} da meta do dia no Universo.`);
  if(i.ontem.meta)f.push(`Ontem fechou em ${mil(i.ontem.venda)} (${fmtPct(i.ontem.pct)}).`);
  if(i.mes.meta)f.push(`No mês até ontem (${ateOntemTxt()}): <b>${mil((i.mes.venda||0)+i.zM)}</b>, ${fmtPct(i.mes.pct)} da meta do período no Universo${i.ant?` (${cresc(i.mes.venda,i.ant)} vs ${D.periodos.mesF.ant.label})`:""}.`);
  if(i.pr?.proj)f.push(`Projeção de fechamento: <b>${mil(i.pr.proj)}</b>, ${fmtPct(i.pr.pctProj)} da meta de ${mil(i.pr.metaMes)}.`);
  if(lj.length>1)f.push(`Melhor loja no mês (até ontem): ${esc(nomeLoja(lj[0].cod))} (${fmtPct(lj[0].pct)}); mais atrás: ${esc(nomeLoja(lj.at(-1).cod))} (${fmtPct(lj.at(-1).pct)}).`);
  if(lh[0])f.push(`Loja que mais vendeu hoje: ${esc(nomeLoja(lh[0].cod))} (${mil(lh[0].venda)}).`);
  return f.join(" ");
}
function secRegs(){
  const regs=REGS();if(!regs.includes(S.reg2))S.reg2=regs[0];const i=regInfo(S.reg2),P=D.periodos;
  const chips=regs.map(r=>{const x=regInfo(r);return `<div class="card reg ${r===S.reg2?"on":""}" data-r2="${r}"><h3>${r} · ${esc(x.lider)}</h3><div class="v">${mil((x.mes.venda||0)+x.zM)}</div><div class="barra"><i style="width:${Math.min(100,(x.mes.pct||0)*100)}%;background:${cor(x.mes.pct)}"></i></div><div class="sub"><b style="color:${cor(x.mes.pct)}">${fmtPct(x.mes.pct)}</b> da meta até ontem${x.ant?` · ${cresc(x.mes.venda,x.ant)} vs ${D.periodos.mesAnt.label.slice(0,3)}`:""} · hoje ${mil((x.hoje.venda||0)+x.zH)}</div></div>`}).join("");
  const zl=zepLoja("mesF"),zh=zepLoja("hoje"),ant=P.mesF.ant.lojas;
  const lojas=lojasDaReg(i.reg,"mesF").filter(l=>l.venda||l.meta).map(l=>{const h=(P.hoje.resumo?.lojas||[]).find(x=>x.cod===l.cod)||{};return {...l,h,z:zl[l.cod]||0,zh:zh[l.cod]||0}}).sort((a,b)=>b.pct-a.pct);
  const cods=new Set(lojas.map(l=>l.cod)),zv={};for(const v of D.zep?.periodos?.mesF?.vendedores||[])if(cods.has(v.loja))zv[v.nome.toUpperCase()]=v.venda;
  const vend=(k)=>(P[k].vendedores||[]).filter(v=>cods.has(v.loja));
  const A=alertasReg(i.reg),ico={alto:"🔴",medio:"🟡",bom:"🟢"};
  return `<div class="grid g4">${chips}</div>
  <div class="card ia sec" id="iaReg"><div class="iat">✨ ${i.reg} · ${esc(i.lider)} <span class="sub">· resumo automático</span> <button id="btIaReg" class="btia" ${IAREG[i.reg]?.on?"disabled":""}>${IAREG[i.reg]?.on?"Analisando…":IAREG[i.reg]?.html?"Analisar com IA de novo":"Analisar com IA agora"}</button></div><p>${resumoReg(i)}</p><div id="iaRegOut">${IAREG[i.reg]?.html||""}</div></div>
  <div class="grid g4" style="margin-top:14px">
    ${kpi("Hoje · Universo + BaianãoEletro",mil((i.hoje.venda||0)+i.zH),`Universo ${mil(i.hoje.venda)} · ${fmtPct(i.hoje.pct)} da meta de ${mil(i.hoje.meta)}`)}
    ${kpi(`Mês até ontem (${ateOntemTxt()}) · Universo + BaianãoEletro`,mil((i.mes.venda||0)+i.zM),`Universo <b style="color:${cor(i.mes.pct)}">${fmtPct(i.mes.pct)}</b> da meta do período (${mil(i.mes.meta)})${i.ant?` · ${cresc(i.mes.venda,i.ant)} vs ${P.mesAnt.label}`:""}`)}
    ${kpi("Projeção de fechamento",i.pr?.proj?mil(i.pr.proj):"—",i.pr?.pctProj?`<b style="color:${cor(i.pr.pctProj)}">${fmtPct(i.pr.pctProj)}</b> da meta de ${mil(i.pr.metaMes)}`:"")}
    ${kpi("Precisa vender por dia",i.pr?mil(i.pr.porDia):"—",i.pr?`nos ${i.pr.diasRest} dias que faltam`:"")}
  </div>
  <div class="hero" style="margin-top:14px;grid-template-columns:1fr 1fr">
    <div class="card"><b>Alertas da ${i.reg}</b><div class="alertas">${A.map(a=>`<div class="al ${a.nivel}"><div>${ico[a.nivel]} ${a.t}</div><div class="sub">${a.d}</div></div>`).join("")||'<div class="sub">Nada fora do normal agora.</div>'}</div></div>
    <div class="card"><b>Vendedores da ${i.reg} · hoje</b>${tabelaSimples([{t:"#",f:(r,x)=>x+1},{t:"Vendedor",l:1,n:1,f:r=>esc(r.nome)},{t:"Loja",l:1,f:r=>esc(nomeLoja(r.loja))},{t:"Venda",f:r=>mil(r.venda)},{t:"Pedidos",f:r=>num(r.pedidos)}],vend("hoje"),{max:12})}</div>
  </div>
  <div class="card sec"><b>Lojas da ${i.reg}</b> <span class="sub">· mês até ontem (${ateOntemTxt()}), ordenadas pelo % da meta; hoje separado</span>${tabelaSimples([{t:"Loja",l:1,n:1,f:r=>esc(nomeLoja(r.cod))},{t:"Hoje",f:r=>mil(r.h.venda||0)},{t:"% meta hoje",f:r=>r.h.meta?pbar(r.h.pct):"—"},{t:"Mês até ontem",f:r=>mil(r.venda)},{t:"Meta até ontem",f:r=>mil(r.meta)},{t:"% meta",f:r=>r.meta?pbar(r.pct):"—"},{t:`vs ${P.mesAnt.label.slice(0,3)} (mesmo período)`,f:r=>cresc(r.venda,ant[r.cod])},{t:"Margem",f:r=>pct(r.margem)},{t:"BaianãoEletro até ontem",f:r=>r.z?mil(r.z):"—"}],lojas,{max:30})}
  <div class="nota">O mês conta só os dias fechados (até ontem): o dia de hoje ainda está acontecendo. O crescimento compara com ${esc(P.mesF.ant.label)}.</div></div>
  <div class="card sec"><b>Vendedores da ${i.reg} · mês até ontem</b>${tabelaSimples([{t:"#",f:(r,x)=>x+1},{t:"Vendedor",l:1,n:1,f:r=>esc(r.nome)},{t:"Loja",l:1,f:r=>esc(nomeLoja(r.loja))},{t:"Universo",f:r=>mil(r.venda)},{t:"BaianãoEletro",f:r=>zv[r.nome.toUpperCase()]?mil(zv[r.nome.toUpperCase()]):"—"},{t:"Pedidos",f:r=>num(r.pedidos)},{t:"Ticket",f:r=>r.pedidos?brl(r.venda/r.pedidos):"—"},{t:"Devolução",f:r=>r.devol?mil(r.devol):"—"}],vend("mesF"),{max:60})}</div>`;
}
// contexto SÓ da regional (lojas e vendedores dela): a IA não tem como misturar com outra regional
function contextoRegional(reg){
  const P=D.periodos,i=regInfo(reg),g=r=>r&&r.meta!==undefined?{venda:fR(r.venda),meta:fR(r.meta),pctMeta:fP(r.pct),margem:fP(r.margem)}:null;
  const F=P.mesF,zl=zepLoja("mesF"),zh=zepLoja("hoje"),lojasM=lojasDaReg(reg,"mesF"),cods=new Set(lojasM.map(l=>l.cod));
  const loc=new Date(new Date(D.geradoEm).getTime()-3*3600e3);
  const zvM={};for(const v of D.zep?.periodos?.mesF?.vendedores||[])if(cods.has(v.loja))zvM[v.nome]=v;
  return {dadosDe:`${String(loc.getUTCHours()).padStart(2,"0")}:${String(loc.getUTCMinutes()).padStart(2,"0")} de ${P.hoje.inicio.split("-").reverse().join("/")}`,
    regional:{reg,lider:i.lider,
      hoje:{universo:g(i.hoje),baianaoEletro:fR(i.zH),total:fR((i.hoje.venda||0)+i.zH)},
      ontem:{universo:g(i.ontem)},
      mes:{periodo:`${F.label}, dia 1 até ${F.ateDia} (até ontem: só dias fechados, sem hoje)`,universo:g(i.mes),baianaoEletro:fR(i.zM),total:fR((i.mes.venda||0)+i.zM),
        mesPassadoMesmoPeriodo:i.ant?fR(i.ant):null,crescimentoUniverso:i.ant?fP(i.mes.venda/i.ant-1):null,
        projecao:i.pr?{fechamento:fR(i.pr.proj),projecaoEmPctDaMetaDoMesInteiro:fP(i.pr.pctProj),metaDoMesInteiro:fR(i.pr.metaMes),precisaPorDia:fR(i.pr.porDia),diasRestantes:i.pr.diasRest,eficiencia7dias:fP(i.pr.efic)}:null}},
    lojasDaRegional:lojasM.filter(l=>l.venda||l.meta).map(l=>{const h=(P.hoje.resumo?.lojas||[]).find(x=>x.cod===l.cod)||{};return {loja:nomeLoja(l.cod),
      hoje:{venda:fR(h.venda),meta:fR(h.meta),pctMeta:h.meta?fP(h.pct):"sem meta"},
      mes:{venda:fR(l.venda),metaAteOntem:fR(l.meta),pctDaMetaAteOntem:l.meta?fP(l.pct):"sem meta",crescimento:F.ant.lojas[l.cod]?fP(l.venda/F.ant.lojas[l.cod]-1):null,margem:fP(l.margem),baianaoEletro:zl[l.cod]?fR(zl[l.cod]):fR(0)}}}),
    vendedoresDaRegional:{hoje:(P.hoje.vendedores||[]).filter(v=>cods.has(v.loja)).slice(0,10).map(v=>({nome:v.nome,loja:nomeLoja(v.loja),venda:fR(v.venda),pedidos:v.pedidos})),
      mes:(F.vendedores||[]).filter(v=>cods.has(v.loja)).slice(0,15).map(v=>({nome:v.nome,loja:nomeLoja(v.loja),venda:fR(v.venda),pedidos:v.pedidos,devolucao:fR(v.devol),baianaoEletro:zvM[v.nome]?fR(zvM[v.nome].venda):fR(0)}))}};
}
const IAREG={}; // análise da IA por regional (fica guardada entre as atualizações da página)
const reRender=()=>{if(S.sec==="regs")render()};
async function iaRegional(){
  const reg=S.reg2;if(!CHAT_URL||IAREG[reg]?.on)return;
  IAREG[reg]={on:1,html:'<p class="sub">A IA está analisando a regional com os números de agora (até 1 minuto)…</p>'};reRender();
  try{const ctx=contextoRegional(reg),k=await chave(),idx=indice(ctx),i=regInfo(reg);
    const q=`Analise a regional ${reg} (líder ${i.lider}) com os dados enviados, que são SÓ desta regional. Responda em no máximo 220 palavras, sem tabelas, exatamente nestes blocos:
**Hoje** (1 a 2 frases)
**Mês e projeção** (1 a 2 frases)
**Destaques** (até 3 itens: lojas/vendedores que puxam pra cima, com número)
**Atenção** (até 3 itens: lojas/vendedores atrás, com número)
**Ações** (3 itens: quem faz o quê — líder ${i.lider} ou gerente da loja X — baseado num número dos dados; sem metas ou números inventados)`;
    const pede=(pergunta,hist)=>chamarIA({pergunta,contexto:ctx,historico:hist},m=>{IAREG[reg]={on:1,html:`<p class="sub">${esc(m)}</p>`};reRender()});
    let j=await pede(q,[]),resp=j.resposta,erros=verificar(resp,ctx,idx),n=0;
    while(erros.length&&n<2){n++;j=await pede(`Sua resposta tem números que NÃO batem com os dados:\n${textoErros(erros)}\nReescreva a análise INTEIRA da regional ${reg}, corrigindo esses pontos e usando somente números do JSON ligados à loja/regional/vendedor e ao período certos.`,[{role:"user",content:q},{role:"assistant",content:resp}]);resp=j.resposta;erros=verificar(resp,ctx,idx)}
    window.__iaErros=erros;window.__iaBruta=resp; // pra diagnóstico
    if(erros.length)resp=limpar(resp,erros);
    IAREG[reg]={html:`<div class="m a" style="max-width:none;margin-top:10px">${md(resp)}<span class="mod">IA · ${esc(j.modelo||"")} · dados de ${esc(ctx.dadosDe.slice(0,5))} · ✔ números conferidos com os dados${erros.length?` (${erros.length} trecho(s) sem base retirados)`:""}</span></div>`};
  }catch(e){IAREG[reg]={html:`<p class="sub">${e.message==="COTA"?"O limite grátis diário da IA acabou por hoje. Ele renova às 21h.":`Não consegui analisar agora (${esc(e.message)}). Tente de novo em instantes.`}</p>`}}
  reRender();
}

  $("#secs").innerHTML=SECS.map(([k,t])=>`<button data-s="${k}" class="${S.sec===k?"on":""}">${t}</button>`).join("");
  $("#secs").onclick=e=>{const s=e.target.dataset.s;if(s){S.sec=s;if(s!=="uni"&&S.per==="regionais")S.per="mes";salva2();render()}};
  if(S.sec==="uni"){renderUni();$("#tabsP").style.display="";return}
  cabecalho();
  $("#tabsP").style.display=S.sec==="geral"||S.sec==="regs"?"none":"";
  [...$("#tabsP").querySelectorAll("button")].forEach(b=>{if(b.dataset.p==="regionais")b.remove()});
  if(S.per==="regionais")S.per="mes";
  $("#tabsP").onclick=e=>{const p=e.target.dataset.p;if(p){S.per=p;salva2();render()}};

  if(S.sec==="regs"){document.querySelectorAll("[data-r2]").forEach(el=>el.onclick=()=>{S.reg2=el.dataset.r2;try{localStorage.setItem("painel-reg2",S.reg2)}catch(e){}render()});$("#btIaReg").onclick=iaRegional;if(!CHAT_URL)$("#btIaReg").style.display="none"}
}
