<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="dados" content="https://raw.githubusercontent.com/bacetto/vendas-baianao/dados/dados.enc,https://raw.githubusercontent.com/bacetto/vendas-baianao/main/dados.enc">
<meta name="chat" content="https://painel-baianao-chat.gabriel-bacetto.workers.dev">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Gestão à Vista · Baianão (nova versão)</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#12172b;--mut:#6b7285;--line:#e4e6ee;--navy:#14246b;--red:#e02b2b;--ok:#0e9f6e;--bad:#d63b3b;--warn:#c98a00;--soft:#eef0f7;--meta:#1e88e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:14px 18px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:22px;border-bottom:4px solid var(--red)}
h1{font-size:18px;margin:0;font-weight:700}
.quando{font-size:20px;font-weight:700;color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:none;padding:7px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;text-transform:capitalize}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff}
.vivo{color:var(--mut);font-size:13px}.vivo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.vivo.velho i{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.hero{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:14px}
.sub{color:var(--mut);font-size:13px}
.big{font-size:54px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:4px 0 8px}
.big small{font-size:24px;font-weight:700;margin-right:6px;letter-spacing:0}
.linha{margin:5px 0;color:var(--mut)}.linha b{color:var(--ink)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.barra{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 4px}.barra i{display:block;height:100%;background:var(--navy);border-radius:9px}
.dest{font-size:17px;margin-top:10px}.dest b{color:var(--ok)}
.grid{display:grid;gap:12px;margin-top:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.reg{cursor:pointer;border-top:3px solid var(--navy);transition:box-shadow .15s}
.reg:hover{box-shadow:0 2px 10px #14246b22}.reg.on{outline:2px solid var(--navy)}
.reg h3{margin:0;font-size:13px;font-weight:700}.reg .v{font-size:24px;font-weight:800;margin:4px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cat .n{font-size:12px;color:var(--mut)}.cat .v{font-weight:800;font-size:16px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini div b{display:block;font-size:17px}
.sec{margin-top:16px}
.ferr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{min-width:230px}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#f8f9fc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);cursor:pointer;user-select:none;z-index:1}
th.s::after{content:" ↓"}th.s.asc::after{content:" ↑"}
td.l,th.l{text-align:left}td.nome{white-space:normal;min-width:180px;font-weight:600}
tr:hover td{background:#fafbff}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--soft);font-size:11px;font-weight:700;color:var(--navy)}
.pb{display:inline-block;width:70px;height:6px;background:var(--soft);border-radius:6px;vertical-align:middle;margin-right:6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:6px}
.rk{color:var(--mut);width:34px}
.nota{color:var(--mut);font-size:12px;margin-top:8px}
svg text{font:11px system-ui,sans-serif;fill:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);align-items:center}
.leg i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--navy);vertical-align:middle;margin-right:5px}.leg i.d{border-top:2px dashed #9aa1b5}.leg i.m{border-top-color:var(--meta)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 9px;border-radius:7px;font-size:12px;display:none;z-index:9}
.secs button{text-transform:none}.secs button.on{background:var(--navy)}
.kpi .kv{font-size:28px;font-weight:900;letter-spacing:-.5px;margin:4px 0}
.ia{border:1px solid #c9d2f5;background:linear-gradient(135deg,#f5f7ff,#fff 60%)}.ia p{margin:8px 0 0;font-size:15px;line-height:1.55}.iat{font-weight:800;font-size:15px}
.alertas{display:flex;flex-direction:column;gap:8px;margin-top:10px}.al{border-left:4px solid var(--line);padding:6px 10px;background:#fafbfe;border-radius:6px}
.iam{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.3px}.iagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.ialst{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.ialst ul{margin:6px 0 0;padding-left:18px}.ialst li{margin:4px 0}
.ialst.ok{border-top:3px solid var(--ok)}.ialst.at{border-top:3px solid var(--warn)}.ialst.ac{border-top:3px solid var(--navy)}
@media(max-width:900px){.iagrid{grid-template-columns:1fr}}
#chatBtn{position:fixed;right:22px;bottom:22px;z-index:20;border:0;border-radius:30px;padding:13px 20px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#14246b,#4f46e5);box-shadow:0 8px 24px #14246b55;cursor:pointer}
#chat{position:fixed;right:22px;bottom:84px;width:min(440px,calc(100vw - 30px));height:min(640px,calc(100vh - 120px));z-index:21;display:none;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #12172b40;overflow:hidden}
#chat.on{display:flex}#chat header{margin:0;padding:12px 16px;background:linear-gradient(135deg,#14246b,#4f46e5);color:#fff;display:flex;justify-content:space-between;align-items:center}
#chat header b{font-size:15px}#chat header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f7f8fc}
.m{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.45;font-size:14px;white-space:normal}.m ul{margin:4px 0;padding-left:18px}
.m.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.a .mod{display:block;margin-top:6px;font-size:11px;color:var(--mut)}.m.p{color:var(--mut);font-style:italic}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug button{border:1px solid #c9d2f5;background:#fff;color:var(--navy);border-radius:16px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
#chatF{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}#chatF input{flex:1}#chatF button{border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.al.alto{border-left-color:var(--bad)}.al.medio{border-left-color:var(--warn)}.al.bom{border-left-color:var(--ok)}.al .sub{margin-top:3px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.big{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">B</div><h1>Painel de Gestão à Vista</h1><span class="quando" id="quando"></span>
  <div class="tabs secs" id="secs"></div>
  <div class="tabs" id="tabsP"></div>
  <span class="vivo" id="vivo"></span>
</header>
<div id="app"><div class="card">Carregando dados…</div></div>
</div>
<div id="tip"></div>
<button id="chatBtn" style="display:none">✨ Pergunte ao painel</button>
<div id="chat"><header><b>✨ Pergunte ao painel</b><button id="chatX" title="Fechar">×</button></header><div id="msgs"></div>
<form id="chatF"><input id="chatI" placeholder="Ex.: quais lojas da R2 estão mais atrás no mês?" autocomplete="off"><button>Enviar</button></form></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const brl=(v,d=0)=>(v<0?"-":"")+"R$ "+Math.abs(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const mil=v=>Math.abs(v)>=1e6?"R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi":Math.abs(v)>=1e3?"R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":brl(v);
const num=v=>(v||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const pct=(v,d=1)=>((v||0)*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const delta=(a,b)=>{if(!b)return"";const d=a/b-1;return `<span class="${d>=0?"up":"down"}">${d>=0?"↑ +":"↓ "}${pct(d)}</span>`};
const cor=p=>p>=1?"var(--ok)":p>=.8?"var(--warn)":"var(--bad)";
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
let D=null,S={per:"hoje",aba:"loja",reg:"",loja:"",q:"",sort:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("painel-baianao")||"{}"),{q:""})}catch(e){}
const salva=()=>{try{localStorage.setItem("painel-baianao",JSON.stringify({per:S.per,aba:S.aba,sec:S.sec}))}catch(e){}};
const nomeLoja=c=>{const l=D.lojas[c];return l?`${String(l.num).padStart(2,"0")} · ${l.nome||"Loja "+l.num}`:c};
const regLoja=c=>D.lojas[c]?.regional||"Sem regional";

const DADOS_URL=(document.querySelector('meta[name="dados"]')||{}).content||"";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abre(enc,senha){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const zip=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},k,b64(enc.dados));
  const txt=await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
function pedeSenha(enc,erro){
  $("#app").innerHTML=`<div class="card" style="max-width:380px;margin:60px auto;text-align:center"><div class="logo" style="margin:0 auto 12px">B</div><b style="font-size:17px">Painel de vendas</b><p class="sub">Acesso restrito. Digite a senha.</p>
  <form id="fS"><input type="password" id="iS" placeholder="Senha" autofocus style="width:100%;margin-bottom:10px"><button style="width:100%;padding:9px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer">Entrar</button></form>
  <p class="down" style="min-height:18px">${erro?"Senha incorreta.":""}</p></div>`;
  $("#fS").onsubmit=async e=>{e.preventDefault();const s=$("#iS").value;try{D=await abre(enc,s);try{localStorage.setItem("painel-baianao-s",s)}catch(x){}render()}catch(x){pedeSenha(enc,true)}};
}
async function carrega(){
  try{const r=await fetch("dados.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();render();return}catch(e){}
  try{let enc=null;
    // versão mais nova sem esperar o cache de 5 min: pega o commit atual do ramo "dados" e baixa por ele
    try{const c=await fetch("https://api.github.com/repos/bacetto/vendas-baianao/commits/dados",{cache:"no-cache",headers:{Accept:"application/vnd.github+json"}});
      if(c.ok){const sha=(await c.json()).sha;if(sha&&sha===window.__sha&&D)return;const r=await fetch(`https://raw.githubusercontent.com/bacetto/vendas-baianao/${sha}/dados.enc`);if(r.ok){enc=await r.json();window.__sha=sha}}}catch(x){}
    for(const u of enc?[]:[...DADOS_URL.split(",").map(x=>x.trim()).filter(Boolean),"dados.enc"]){if(!u)continue;try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(r.ok){enc=await r.json();break}}catch(x){}}if(!enc)throw 0;let s="";try{s=localStorage.getItem("painel-baianao-s")||""}catch(x){}
    if(s){try{D=await abre(enc,s);render();return}catch(x){}}
    if(!D)pedeSenha(enc)}
  catch(e){if(!D)$("#app").innerHTML='<div class="card">Ainda sem dados. A primeira coleta do portal está a caminho.</div>'}
}
function cabecalho(){
  const g=new Date(D.geradoEm),loc=new Date(g.getTime()-3*3600e3);
  const hh=String(loc.getUTCHours()).padStart(2,"0")+":"+String(loc.getUTCMinutes()).padStart(2,"0");
  $("#quando").textContent=`${DIAS[loc.getUTCDay()]} ${String(loc.getUTCDate()).padStart(2,"0")}/${String(loc.getUTCMonth()+1).padStart(2,"0")} · ${hh}`;
  const min=Math.round((Date.now()-g)/6e4);
  const hojeLoc=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),diaDados=loc.toISOString().slice(0,10);
  const outroDia=hojeLoc!==diaDados;
  $("#vivo").className="vivo"+(min>45?" velho":"");
  $("#vivo").innerHTML=outroDia?`<i></i><b style="color:var(--warn)">dados de ${String(loc.getUTCDate()).padStart(2,"0")}/${String(loc.getUTCMonth()+1).padStart(2,"0")} às ${hh}</b> · a leitura do dia começa às 7h`:`<i></i>${min>45?"última leitura":"ao vivo"} · dados de ${hh}`+(min>45?` (há ${min>=120?Math.round(min/60)+" h":min+" min"})`:"");
  const P=D.periodos;
  $("#tabsP").innerHTML=["hoje","ontem","mes","mesAnt"].map(k=>`<button data-p="${k}" class="${S.per===k?"on":""}">${k==="mes"?"Mês":P[k].label}</button>`).join("")+
    (D.regionaisComparativo?`<button data-p="regionais" class="${S.per==="regionais"?"on":""}">Regionais</button>`:"");
  $("#tabsP").onclick=e=>{const p=e.target.dataset.p;if(p){S.per=p;S.sort={};salva();render()}};
}
function diasHist(){return Object.keys(D.historicoHoras||{}).filter(k=>(D.historicoHoras[k]||[]).length).sort().reverse()}
function mesAntDe(dia){const [y,m,d]=dia.split("-").map(Number);const dt=new Date(Date.UTC(y,m-2,1));const ult=new Date(Date.UTC(y,m-1,0)).getUTCDate();return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(Math.min(d,ult)).padStart(2,"0")}`}
function metaDoDia(dia,reg){const M=(reg?D.diario.porRegional?.[reg]?.meta:D.diario.metaAtual)||[];if(!M.length||dia.slice(0,7)!==D.periodos.mes.inicio.slice(0,7))return 0;const i=Number(dia.slice(8))-1;return (M[i]||0)-(i?M[i-1]||0:0)}
const fmtH=m=>`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`;
function colReg(reg){return reg?1+Number(reg.slice(1)):1}
function graficoDia(dia,reg,nome){
  const H0=420,H1=1320,W=900,H=250,L=52,R=78,T=14,Bm=26,hist=D.historicoHoras||{};
  const k=colReg(reg),A=(hist[dia]||[]).map(p=>[p[0],p[k]||0]),ant=mesAntDe(dia),B=(hist[ant]||[]).map(p=>[p[0],p[k]||0]),md=metaDoDia(dia,reg);
  // meta do dia distribuída por igual das 8h às 20h
  const Mt=md?[[H0,0],[480,0],[1200,md],[H1,md]]:[];
  const max=Math.max(...A.map(p=>p[1]),...B.map(p=>p[1]),md,1)*1.1;
  const x=m=>L+(W-L-R)*((Math.min(H1,Math.max(H0,m))-H0)/(H1-H0)),y=v=>T+(H-T-Bm)*(1-v/max);
  const path=arr=>arr.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const passo=max>6e5?1e5:max>3e5?5e4:max>1.2e5?25e3:1e4;let grade="";
  for(let v=0;v<=max;v+=passo)grade+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e9ebf2"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v/1e3).toLocaleString("pt-BR")}</text>`;
  let eixo="";for(let h=7;h<=22;h++)eixo+=`<text x="${x(h*60)}" y="${H-6}" text-anchor="middle">${h}h</text>`;
  const u=A[A.length-1],dd=s=>s.slice(8)+"/"+s.slice(5,7),q=md&&u?u[1]/md:0;
  const ehHoje=dia===D.periodos.hoje.inicio;
  return `<b>${ehHoje?"Hoje":dd(dia)} hora a hora · ${nome||"todas as lojas"}${md&&u?` <span style="font-weight:600;color:${cor(q)}">· ${pct(q)} da meta do dia</span>`:""}</b>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px">${grade}${eixo}
  ${B.length?`<path d="${path(B)}" fill="none" stroke="#9aa1b5" stroke-width="2" stroke-dasharray="5 4"/><text x="${x(B[B.length-1][0])+6}" y="${y(B[B.length-1][1])-6}">${dd(ant)} · ${mil(B[B.length-1][1])}</text>`:""}
  ${Mt.length?`<path d="${path(Mt)}" fill="none" stroke="var(--meta)" stroke-width="2.5"/><text x="${W-R+6}" y="${y(md)-4}" style="fill:var(--meta)">meta do dia</text><text x="${W-R+6}" y="${y(md)+10}" style="font-weight:700;fill:var(--meta)">${mil(md)}</text>`:""}
  ${A.length?`<path d="${path(A)}" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(u[0])}" cy="${y(u[1])}" r="5" fill="var(--red)" stroke="#fff" stroke-width="2"/>
  <text x="${x(u[0])+9}" y="${y(u[1])+14}" style="font-weight:700;fill:var(--ink)">${fmtH(u[0])} · ${mil(u[1])}</text>`:""}
  <rect class="grafHitDia" data-dia="${dia}" data-reg="${reg||""}" data-nome="${esc(nome||"")}" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-Bm}" fill="transparent"/></svg>
  <div class="nota">Venda acumulada do dia, lida a cada 5 min${B.length?` · tracejado: ${dd(ant)} (mesmo dia do mês passado)`:` · o mesmo dia do mês passado aparece quando houver registro dele (começou em ${dd(diasHist().slice(-1)[0]||dia)})`}${md?" · meta do dia distribuída por igual das 8h às 20h":""}.</div>`;
}
function ligaGraficoDia(){
  document.querySelectorAll(".grafHitDia").forEach(hit=>{const tip=$("#tip"),dia=hit.dataset.dia,reg=hit.dataset.reg||null,hist=D.historicoHoras||{},k=colReg(reg);
  const A=(hist[dia]||[]).map(p=>[p[0],p[k]||0]),B=(hist[mesAntDe(dia)]||[]).map(p=>[p[0],p[k]||0]),md=metaDoDia(dia,reg);
  const ate=(arr,m)=>{let r=null;for(const p of arr){if(p[0]<=m)r=p;else break}return r};
  hit.onmousemove=e=>{const r=hit.getBoundingClientRect(),m=Math.round(420+(e.clientX-r.left)/r.width*900);
    const a=ate(A,m),b=ate(B,m),mt=md?md*Math.min(1,Math.max(0,(m-480)/720)):0;
    tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";
    tip.innerHTML=`<b>${hit.dataset.nome?hit.dataset.nome+" · ":""}${fmtH(m)}</b><br>vendido: ${a?mil(a[1])+" (leitura das "+fmtH(a[0])+")":"—"}${B.length?`<br>mês passado: ${b?mil(b[1]):"—"}`:""}${md?`<br>meta até aqui: ${mil(mt)}`+(a&&mt?` · ${pct(a[1]/mt)}`:""):""}`};
  hit.onmouseleave=()=>tip.style.display="none";});
}
// card com botão "Mês | Dia por hora" (geral ou de uma regional)
function graficoCard(z){

const salva2=()=>{try{localStorage.setItem("painel-baianao",JSON.stringify({per:S.per,aba:S.aba,sec:S.sec}))}catch(e){}};
const soma=a=>(a||[]).reduce((s,x)=>s+(x||0),0);
const hoje=()=>Number(D.periodos.hoje.fim.slice(8));
const fmtPct=v=>pct(v,0);

// ---------- motor de análise ----------
function metaDias(M){return (M||[]).map((v,i)=>i?v-M[i-1]:v)}
// fração do dia que normalmente já foi vendida até o minuto m (pela história das últimas semanas)
function fracaoDoDia(m,col=1){
  const H=D.historicoHoras||{},hojeISO=D.periodos.hoje.inicio,fr=[];
  for(const dia of Object.keys(H)){if(dia===hojeISO)continue;const L=H[dia];if(!L||L.length<20)continue;const fim=L[L.length-1][col];if(!(fim>0))continue;
    if(L[L.length-1][0]<20*60)continue;let v=0;for(const p of L){if(p[0]<=m)v=p[col];else break}fr.push(v/fim)}
  if(fr.length<3)return null;fr.sort((a,b)=>a-b);return fr[Math.floor(fr.length/2)];
}
function minutoAgora(){const g=new Date(new Date(D.geradoEm).getTime()-3*3600e3);return g.getUTCHours()*60+g.getUTCMinutes()}
// projeção de fechamento do mês: vendido até ontem + (meta dos dias que faltam × eficiência dos últimos 7 dias)
function projecao(reg){
  const d=hoje(),c=D.comparativos,rc=D.regionaisComparativo;if(!rc)return null;
  const serie=reg?D.diario.porRegional?.[reg]:{atual:D.diario.atual,meta:D.diario.metaAtual};if(!serie||!serie.meta?.length)return null;
  const md=metaDias(serie.meta),A=serie.atual;
  // escala: o diário vem das linhas de produto; o oficial vem do resumo do portal
  const k=c&&d>1&&soma(D.diario.atual.slice(0,d-1))?c.atual.venda/soma(D.diario.atual.slice(0,d-1)):1;
  const ini=Math.max(0,d-8),fim=d-1;const v7=soma(A.slice(ini,fim))*k,m7=soma(md.slice(ini,fim));
  const efic=m7?v7/m7:null;
  const linha=reg?rc.regionais.find(x=>x.reg===reg):rc.rede;if(!linha)return null;
  const ateOntem=d>1?soma(A.slice(0,d-1))*k:0,metaMes=linha.metaMes||serie.meta[serie.meta.length-1];
  // hoje conta o que já vendeu (ou o ritmo, se ainda estiver abaixo); os dias seguintes, meta × eficiência
  const hj=D.periodos.hoje.resumo,vendaHoje=(reg?hj?.regionais?.find(x=>x.reg===reg)?.venda:hj?.geral?.venda)||0;
  const metaDepois=metaMes-serie.meta[Math.min(d,serie.meta.length)-1];
  const proj=efic!=null?ateOntem+Math.max(vendaHoje,(md[d-1]||0)*efic)+metaDepois*efic:null;
  const diasRest=serie.meta.length-d+1;
  const porDia=diasRest>0?Math.max(0,metaMes-linha.venda)/diasRest:0;
  // pelo ritmo do mês passado (comparando o mesmo número de dias)
  const projAnt=linha.anteriorMesmoPeriodo?linha.anteriorFechado*(linha.venda/linha.anteriorMesmoPeriodo):null;
  return {proj,efic,metaMes,venda:linha.venda,porDia,diasRest,projAnt,pctProj:proj&&metaMes?proj/metaMes:null,lider:linha.lider,reg:linha.reg};
}
function alertas(){
  const A=[],P=D.periodos,m=P.mes,h=P.hoje,d=hoje();
  // 1) ritmo de hoje x o normal pra esta hora
  const g=h.resumo?.geral,mm=minutoAgora(),fr=fracaoDoDia(mm);
  if(g&&g.meta&&fr&&fr>.05&&mm>=10*60&&mm<=21*60){const esp=g.meta*fr,r=g.venda/esp;
    A.push({nivel:r<.85?"alto":r<1?"medio":"bom",t:r>=1?`Hoje a rede está <b>${fmtPct(r)}</b> do esperado pra este horário`:`Hoje a rede está em <b>${fmtPct(r)}</b> do que costuma ter vendido até agora`,
      d:`Pelo histórico, até ${fmtH(mm)} já sai ${fmtPct(fr)} da venda do dia. Esperado agora: ${mil(esp)} · vendido: ${mil(g.venda)}.`});
    (h.resumo.regionais||[]).forEach(x=>{const fx=fracaoDoDia(mm,colReg(x.reg));if(!fx||!x.meta)return;const rr=x.venda/(x.meta*fx);if(rr<.75)A.push({nivel:"alto",t:`${x.reg} · ${esc(x.lider)} abaixo do ritmo hoje: <b>${fmtPct(rr)}</b> do esperado`,d:`Vendeu ${mil(x.venda)}; pra este horário o normal seria ${mil(x.meta*fx)}.`})});
  }
  // 2) projeção do mês
  const pr=projecao();if(pr&&pr.pctProj!=null){A.push({nivel:pr.pctProj<.95?"alto":pr.pctProj<1?"medio":"bom",t:`Projeção do mês: <b>${mil(pr.proj)}</b> (${fmtPct(pr.pctProj)} da meta de ${mil(pr.metaMes)})`,
    d:`Faltam ${mil(Math.max(0,pr.metaMes-pr.venda))} em ${pr.diasRest} dias: precisa de <b>${mil(pr.porDia)}/dia</b>. Nos últimos 7 dias a rede fez ${fmtPct(pr.efic)} da meta diária.`})}
  // 3) lojas fora do ritmo no mês
  const lj=(m.resumo?.lojas||[]).filter(l=>l.meta>0);
  const piores=lj.filter(l=>l.pct<.75).sort((a,b)=>a.pct-b.pct);
  if(piores.length)A.push({nivel:"alto",t:`${piores.length} loja${piores.length>1?"s":""} abaixo de 75% da meta no mês`,d:piores.slice(0,6).map(l=>`${esc(nomeLoja(l.cod))} <b style="color:var(--bad)">${fmtPct(l.pct)}</b>`).join(" · ")});
  const melhores=lj.filter(l=>l.pct>=1).sort((a,b)=>b.pct-a.pct);
  if(melhores.length)A.push({nivel:"bom",t:`${melhores.length} loja${melhores.length>1?"s":""} acima da meta no mês`,d:melhores.slice(0,6).map(l=>`${esc(nomeLoja(l.cod))} <b style="color:var(--ok)">${fmtPct(l.pct)}</b>`).join(" · ")});
  // 4) margem fora da curva
  const mg=m.resumo?.geral?.margem;if(mg){const baixa=lj.filter(l=>l.venda>50000&&l.margem<mg-.06).sort((a,b)=>a.margem-b.margem);
    if(baixa.length)A.push({nivel:"medio",t:`Margem baixa em ${baixa.length} loja${baixa.length>1?"s":""} (rede: ${pct(mg)})`,d:baixa.slice(0,5).map(l=>`${esc(nomeLoja(l.cod))} ${pct(l.margem)}`).join(" · ")})}
  // 5) devoluções altas
  const dv=(m.vendedores||[]).filter(v=>v.venda>30000&&-v.devol/v.venda>.2).sort((a,b)=>a.devol/a.venda-b.devol/b.venda);
  if(dv.length)A.push({nivel:"medio",t:`${dv.length} vendedor${dv.length>1?"es":""} com devolução acima de 20% da venda`,d:dv.slice(0,5).map(v=>`${esc(v.nome)} (${esc(nomeLoja(v.loja))}) ${fmtPct(-v.devol/v.venda)}`).join(" · ")});
  // 6) vendedores caindo em relação ao mês passado (ritmo por dia)
  if(d>=7){const ant={};for(const v of P.mesAnt.vendedores||[])ant[v.cod+"|"+v.loja]=v;const nAnt=Number(P.mesAnt.fim.slice(8));
    const nz=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();
    const zv={};for(const v of D.zep?.periodos?.mes?.vendedores||[])zv[nz(v.nome)]=(zv[nz(v.nome)]||0)+v.venda;
    const caindo=(m.vendedores||[]).map(v=>{const a=ant[v.cod+"|"+v.loja];if(!a||a.venda<40000)return null;const r=((v.venda+(zv[nz(v.nome)]||0))/d)/(a.venda/nAnt);return r<.6?{...v,r}:null}).filter(Boolean).sort((a,b)=>a.r-b.r);
    if(caindo.length)A.push({nivel:"medio",t:`${caindo.length} vendedor${caindo.length>1?"es":""} vendendo bem menos que no mês passado`,d:caindo.slice(0,6).map(v=>`${esc(v.nome)} <b style="color:var(--bad)">${fmtPct(v.r-1)}</b>`).join(" · ")+` <span class="sub">(venda por dia no Universo + ZepSystem, este mês x ${P.mesAnt.label})</span>`})}
  // 7) ZepSystem
  const z=D.zep?.periodos?.mes;if(z&&z.pedidosTotal){if(z.taxaCancelamento>.3)A.push({nivel:"alto",t:`ZepSystem: <b>${fmtPct(z.taxaCancelamento)}</b> dos pedidos do mês foram cancelados`,d:`${num(z.pedidosCancelados)} cancelados (${mil(z.cancelado)}) de ${num(z.pedidosTotal)} pedidos. Vale entender o motivo: pagamento recusado, desistência ou erro de cadastro.`});
    if(z.aguardando>0)A.push({nivel:"medio",t:`ZepSystem: ${num(z.pedidosAguardando)} pedidos aguardando (${mil(z.aguardando)})`,d:`Ainda não contam como venda. Cobrar a finalização com os vendedores.`})}
  const ordem={alto:0,medio:1,bom:2};return A.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}

function barras(vals,labels,{alt=150,cor0="var(--navy)",fmt=mil,dest=-1}={}){

// ---------- verificador de números (mesmo código de painel/verificador.js) ----------
// Verificador de respostas da IA: confere cada número do texto contra os dados enviados.
// Erro = número que não existe nos dados, ou que existe mas é de outra loja/regional/vendedor
// diferente do citado na mesma frase. Usado pelo chat (Worker) e pela análise automática.
const normV = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();

// números com unidade: R$ (com mil/mi) e %
function numeros(txt) {
  const t = String(txt).replace(/ /g, " "), out = [];
  for (const m of t.matchAll(/R\$\s*(-?\s*[\d.]+(?:,\d+)?)\s*(milh(?:[õo]es|[ãa]o)|mil|mi)?\b/gi)) {
    let v = parseFloat(m[1].replace(/\s/g, "").replace(/\./g, "").replace(",", "."));
    const u = (m[2] || "").toLowerCase();
    if (u === "mil") v *= 1e3; else if (u.startsWith("mi")) v *= 1e6;
    if (!isNaN(v)) out.push({ t: "R", v, raw: m[0].trim() });
  }
  for (const m of t.matchAll(/(-?\d+(?:[.,]\d+)?)\s*%/g)) {

    if (!isNaN(v)) out.push({ t: "P", v, raw: m[0].trim() });

// período de um trecho de texto (ou do nome de um campo dos dados)
const PER = [["mesPassado", /\b(m[eê]s passado|m[eê]s anterior|outubro|setembro|agosto|julho|junho|maio|abril|mar[cç]o|fevereiro|janeiro|dezembro)\b/i],
  ["ontem", /\bontem\b/i], ["hoje", /\b(hoje|do dia|no dia|agora)\b/i], ["mes", /\b(m[eê]s|mensal|acumulad|novembro)\b/i]];

function indice(ctx) {
  const ents = new Map();

function citadas(linha, ents) {
  const L = " " + normV(linha).replace(/[·\-–—()]/g, " ") + " ";

    if (a.vend) return a.vend.some((x) => L.includes(" " + x + " ") || L.includes(" " + x));

function verificar(texto, ctx, idx = indice(ctx)) {

  for (const linha of linhas) {
    const citou = citadas(linha, idx);
    if (citou.length) assunto = citou;
    const perLinha = periodoTexto(linha);
    if (perLinha) perAssunto = perLinha;
    const P = perLinha || perAssunto;
    const ns = numeros(linha);
    if (!ns.length) continue;
    const est = /estimativ|aproximad|cerca de|≈|~/i.test(linha);

    const falaDaRede = /\b(rede|geral|todas as lojas|total|consolidad|empresa|categoria|grupo|marca)\b/i.test(linha);

        }

    }
  }

        grupos:(P.mes.grupos||[]).slice(0,12).map(x=>({nome:x.nome,valor:fR(x.valor)})),marcas:(P.mes.marcas||[]).slice(0,12).map(x=>({nome:x.nome,valor:fR(x.valor)})),
        servicos:P.mes.resumo?.geral?{garantia:fR(P.mes.resumo.geral.garantia),pacote:fR(P.mes.resumo.geral.pacote),sorteDobradaQtd:P.mes.resumo.geral.sorteQtd,sorteDobradaValor:fR(P.mes.resumo.geral.sorteValor)}:null},
      mesPassado:{periodo:P.mesAnt.label,geral:g(P.mesAnt.resumo?.geral)},
      leads:{hoje:D.leads?.hoje?{contatos:D.leads.hoje.contatos,leads:D.leads.hoje.leads,convertidos:D.leads.hoje.leadsConvertidos,conversao:fP((D.leads.hoje.taxaConversao||0)/100),vendido:fR(D.leads.hoje.valorVendido)}:null,
        mes:D.leads?.mes?{contatos:D.leads.mes.contatos,convertidos:D.leads.mes.leadsConvertidos,conversao:fP((D.leads.mes.taxaConversao||0)/100),vendido:fR(D.leads.mes.valorVendido),
          porLoja:(D.leads.mes.porLoja||[]).map(l=>({loja:l.nome,contatos:l.contatos,convertidos:l.convertidos,taxa:l.taxa}))}:null}},
    zepSystem:z?{hoje:zp(z.hoje),mes:zp(z.mes),inicio:D.zep.inicioPlataforma}:null,
    alertasDoPainel:alertas().map(a=>a.t.replace(/<[^>]+>/g,""))};
}
const tabMd=t=>t.replace(/((?:^\|.*\|\s*$\n?){2,})/gm,b=>{const L=b.trim().split("\n").filter(l=>!/^\|\s*:?-{2,}/.test(l));const cel=l=>l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  return "\n@@T"+btoa(unescape(encodeURIComponent(JSON.stringify(L.map(cel)))))+"@@\n"});
const md0=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>").replace(/(^|\n)\s*[-•*]\s+(.+)/g,"$1<li>$2</li>").replace(/(<li>.*<\/li>)(?!\s*<li>)/gs,"<ul>$1</ul>").replace(/\n/g,"<br>").replace(/<\/li><br>/g,"</li>").replace(/<ul><br>/g,"<ul>");
const md=t=>md0(tabMd(t)).replace(/@@T([A-Za-z0-9+/=]+)@@/g,(_,x)=>{const R=JSON.parse(decodeURIComponent(escape(atob(x))));
  return `<div class="tw" style="max-height:none;margin:6px 0"><table><thead><tr>${R[0].map(c=>`<th class="l">${md0(c)}</th>`).join("")}</tr></thead><tbody>${R.slice(1).map(r=>`<tr>${r.map(c=>`<td class="l" style="white-space:normal">${md0(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}).replace(/<br>\s*<div class="tw"/g,'<div class="tw"').replace(/(<\/div>)<br>/g,"$1");
const addMsg=(c,h)=>{const d=document.createElement("div");d.className="m "+c;d.innerHTML=h;$("#msgs").appendChild(d);$("#msgs").scrollTop=1e9;return d};
async function chave(){const s=localStorage.getItem("painel-baianao-s")||"";const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function perguntar(q){
  q=q.trim();if(!q)return;$(".sug")?.remove();addMsg("u",esc(q));const w=addMsg("a p","Analisando os números…");
  try{const ctx=contextoChat(),k=await chave(),idx=indice(ctx);
    const pede=async(pergunta,hist)=>{const r=await fetch(CHAT_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Chave":k},body:JSON.stringify({pergunta,contexto:ctx,historico:hist})});
      const j=await r.json();if(!r.ok||!j.resposta)throw new Error(j.erro||"erro");return j};
    let j=await pede(q,HIST),resp=j.resposta,erros=verificar(resp,ctx,idx),rodadas=0;
    // conferência automática: número que não bate com os dados volta pra IA corrigir (até 2 vezes)
    while(erros.length&&rodadas<2){rodadas++;w.innerHTML=`Conferindo os números com os dados… (correção ${rodadas})`;
      j=await pede(`Sua resposta tem números que NÃO batem com os dados:\n${textoErros(erros)}\nReescreva a resposta INTEIRA para a pergunta "${q}", corrigindo esses pontos e usando somente números do JSON, cada um ligado à loja/regional/vendedor certo.`,[...HIST,{role:"user",content:q},{role:"assistant",content:resp}]);
      resp=j.resposta;erros=verificar(resp,ctx,idx)}
    if(erros.length)resp=limpar(resp,erros);
    w.className="m a";w.innerHTML=md(resp)+`<span class="mod">IA · ${esc(j.modelo||"")} · dados de ${esc(ctx.dadosDe.slice(0,5))} · ✔ números conferidos com os dados${erros.length?` (${erros.length} trecho(s) sem base nos dados foram retirados)`:""}</span>`;
    HIST.push({role:"user",content:q},{role:"assistant",content:resp});
  }catch(e){w.className="m a";w.innerHTML=`Não consegui responder agora (${esc(e.message)}). Tente de novo em instantes.`}
  $("#msgs").scrollTop=1e9;
}
function ligaChat(){
  if(!CHAT_URL||$("#chatBtn").dataset.ok)return;$("#chatBtn").dataset.ok=1;$("#chatBtn").style.display="";
  const SUG=["Como está o dia até agora?","Vamos bater a meta do mês?","Quais lojas precisam de atenção?","Quem são os melhores vendedores do mês?","Compare as regionais","Como está o ZepSystem?"];
  $("#chatBtn").onclick=()=>{$("#chat").classList.toggle("on");if(!$("#msgs").children.length){addMsg("a","Olá! Pergunte o que quiser sobre as vendas: lojas, regionais, vendedores, metas, produtos, leads ou ZepSystem. Respondo com os números de agora.");
    const s=document.createElement("div");s.className="sug";s.innerHTML=SUG.map(x=>`<button>${esc(x)}</button>`).join("");s.onclick=e=>{if(e.target.tagName==="BUTTON")perguntar(e.target.textContent)};$("#msgs").appendChild(s)}$("#chatI").focus()};
  $("#chatX").onclick=()=>$("#chat").classList.remove("on");
  $("#chatF").onsubmit=e=>{e.preventDefault();const q=$("#chatI").value;$("#chatI").value="";perguntar(q)};
}

// ---------- roteador ----------
function render(){
  if(!D)return;ligaChat();
  $("#secs").innerHTML=SECS.map(([k,t])=>`<button data-s="${k}" class="${S.sec===k?"on":""}">${t}</button>`).join("");
  $("#secs").onclick=e=>{const s=e.target.dataset.s;if(s){S.sec=s;if(s!=="uni"&&S.per==="regionais")S.per="mes";salva2();render()}};
  if(S.sec==="uni"){renderUni();$("#tabsP").style.display="";return}
  cabecalho();
  $("#tabsP").style.display=S.sec==="geral"?"none":"";
  [...$("#tabsP").querySelectorAll("button")].forEach(b=>{if(b.dataset.p==="regionais")b.remove()});
  if(S.per==="regionais")S.per="mes";
  $("#tabsP").onclick=e=>{const p=e.target.dataset.p;if(p){S.per=p;salva2();render()}};
  $("#app").innerHTML=S.sec==="geral"?secGeral():S.sec==="zep"?secZep():secRede();
}

carrega();setInterval(carrega,20*1000); // sem dado novo o GitHub responde 304 (não conta no limite)setInterval(()=>D&&cabecalho(),60*1000);
</script>
