name: Coleta
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/**", "painel/**", "package.json"]
concurrency:
  group: coleta
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Coletar e publicar
        env:
          PORTAL_CPF: ${{ secrets.PORTAL_CPF }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          SENHA: ${{ secrets.PAINEL_SENHA }}
          ZEP_EMAIL: ${{ secrets.ZEP_EMAIL }}
          ZEP_SENHA: ${{ secrets.ZEP_SENHA }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ -z "$PORTAL_CPF" ] || [ -z "$SENHA" ]; then echo "Faltam secrets"; exit 1; fi
          INICIO=$(date +%s); N=0
          hora() { TZ=America/Bahia date +%-H; }
          publicar() {
            rm -rf pub && mkdir pub && node painel/cifrar.js saida/dados.json pub/dados.enc || return 1
            (cd pub && git init -q -b dados && git config user.name "bacetto" && git config user.email "bacetto@users.noreply.github.com" \
              && git add dados.enc && git commit -qm "dados $(date -u +%FT%TZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" dados)
          }
          # disparador dos relatórios do WhatsApp: este job fica vivo o dia todo, então ele chama o relatorios.yml
          # 4 min antes de cada horário (o slot.js espera o horário cravado e não duplica). Mais preciso que o agendamento do GitHub.
          disparador() {
            while :; do
              dia=$(TZ=America/Bahia date +%F); agora=$((10#$(TZ=America/Bahia date +%H)*60 + 10#$(TZ=America/Bahia date +%M)))
              for s in 402 476 596 716 836 956 1076 1196 1336; do   # 06:42 07:56 09:56 11:56 13:56 15:56 17:56 19:56 22:16
                m="/tmp/disparo-$dia-$s"
                if [ "$agora" -ge "$s" ] && [ "$agora" -lt $((s+25)) ] && [ ! -f "$m" ]; then
                  gh workflow run relatorios.yml --ref main -R "$REPO" -f acao=auto >/dev/null 2>&1 && touch "$m" && echo "disparo relatórios $(TZ=America/Bahia date +%H:%M)"
                fi
              done
              # robô de descontos: o agendamento do GitHub falha muito; daqui (job vivo o dia todo) garante que ele está ligado 07h–23h
              H=$((10#$(TZ=America/Bahia date +%H))); M=$((10#$(TZ=America/Bahia date +%M)))
              if [ "$H" -ge 7 ] && [ "$H" -lt 23 ] && [ $((M % 5)) -eq 0 ] && [ ! -f "/tmp/robo-$dia-$H-$M" ]; then
                touch "/tmp/robo-$dia-$H-$M"
                VIVO=$(gh run list -R "$REPO" -w robo-descontos.yml -L 10 --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null)
                if [ "$VIVO" = "0" ]; then gh workflow run robo-descontos.yml --ref main -R "$REPO" -f acao=rodar >/dev/null 2>&1 && echo "robô de descontos religado $(TZ=America/Bahia date +%H:%M)"; fi
              fi
              # guardião dos horários (status, vigia, análise): se não houver um rodando, liga (um vigia o outro)
              if [ $((M % 5)) -eq 3 ] && [ ! -f "/tmp/guard-$dia-$H-$M" ]; then
                touch "/tmp/guard-$dia-$H-$M"
                G=$(gh run list -R "$REPO" -w guardiao.yml -L 10 --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null)
                if [ "$G" = "0" ]; then gh workflow run guardiao.yml --ref main -R "$REPO" >/dev/null 2>&1 && echo "guardião religado $(TZ=America/Bahia date +%H:%M)"; fi
              fi
              sleep 30
            done
          }
          disparador &
          node painel/raw-restaurar.mjs
          # guarda a base completa (raw.json) criptografada no ramo "dados-raw" — só depois de leitura completa (~10 min)
          guardar_raw() {
            rm -rf pubraw && mkdir pubraw && node painel/cifrar.js saida/raw.json pubraw/raw.enc || return 1
            (cd pubraw && git init -q -b dados-raw && git config user.name "bacetto" && git config user.email "bacetto@users.noreply.github.com" \
              && git add raw.enc && git commit -qm "raw $(date -u +%FT%TZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" dados-raw) && echo "base completa guardada"
          }
          while :; do
            T0=$(date +%s); h=$(hora); HOJE=$(TZ=America/Bahia date +%F)
            tem_base() { node -e 'const r=require("./saida/raw.json");process.exit(r?.periodos?.hoje?.inicio?.startsWith(process.argv[1])?0:1)' "$HOJE" 2>/dev/null; }
            ciclo() {   # $1 = modo (0 completa · 1 leve · 2 leve+ontem); $2 = tempo máximo
              rm -f saida/dados.json
              LEVE=$1 timeout $2 node painel/coletar.js && [ -s saida/dados.json ] && publicar && {
                echo "publicado $(TZ=America/Bahia date +%H:%M) ($([ "$1" = 0 ] && echo completa || { [ "$1" = 2 ] && echo leve+ontem || echo leve; }))"
                [ "$1" != "1" ] && (guardar_raw >/dev/null 2>&1 &)   # completa/ontem atualizam a base guardada
                # IA em paralelo: nunca segura o ciclo da coleta (ela mesma só chama a IA de hora em hora)
                if ! kill -0 "$(cat /tmp/ia.pid 2>/dev/null)" 2>/dev/null; then cp saida/dados.json saida/dados-ia.json; (timeout 300 node painel/ia-run.mjs >> /tmp/ia.log 2>&1 &  echo $! > /tmp/ia.pid); fi
                return 0; }
              return 1
            }
            # 27/11 — MADRUGADA (03h–07h, lojas fechadas): carga COMPLETA do dia novo (mês atual + anterior + metas) e guarda a base.
            # Pega cancelamentos/ajustes de dias anteriores. Se falhar, mantém a base anterior e tenta de novo a cada 10 min;
            # às 06h, se ainda não deu, avisa o Gabriel. (Às 07h, sem base, o dia começa com a completa — igual era antes.)
            if [ "$h" -ge 3 ] && [ "$h" -lt 7 ] && ! tem_base; then
              ULTN=$(cat /tmp/noturna-tentou 2>/dev/null || echo 0)
              if [ $(( $(date +%s) - ULTN )) -ge 600 ]; then
                date +%s > /tmp/noturna-tentou
                ciclo 0 900 && echo "✅ carga da madrugada ok" || echo "⚠️ carga da madrugada falhou — tenta de novo em 10 min"
              fi
              if [ "$h" -ge 6 ] && ! tem_base && [ ! -f "/tmp/noturna-aviso-$HOJE" ]; then
                touch "/tmp/noturna-aviso-$HOJE"
                gh workflow run relatorios.yml -R "$REPO" --ref main -f acao=alerta -f texto="⚠️ *Painel Vendas ao vivo*: a carga completa da madrugada não conseguiu ler o portal (sigo tentando). O painel abre às 07h com a última base." >/dev/null 2>&1
              fi
            fi
            if [ "$h" -ge 7 ] && [ "$h" -lt 23 ]; then   # até 23h: pega o fechamento das lojas de shopping (22h) e os lançamentos finais
              N=$((N+1))
              # durante o dia: só a leitura LEVE (1 min). Às 10h, 14h e 18h: leve + reconferência de ONTEM (cancelamentos).
              # Sem base de hoje (madrugada falhou): completa — se ela falhar, a próxima tentativa é de novo completa só no ciclo seguinte.
              MODO=1; TO=180
              if ! tem_base; then MODO=0; TO=600
              elif { [ "$h" = 10 ] || [ "$h" = 14 ] || [ "$h" = 18 ]; } && [ ! -f "/tmp/ontem-$HOJE-$h" ]; then MODO=2; TO=300; fi
              for t in 1 2 3; do
                if ciclo $MODO $TO; then [ "$MODO" = 2 ] && touch "/tmp/ontem-$HOJE-$h"; break; fi
                echo "tentativa $t falhou"; sleep 10
                # reconferência de ontem falhou: o painel não espera por ela (volta pra leve; tenta ontem de novo no próximo ciclo)
                [ "$MODO" = 2 ] && { MODO=1; TO=180; }
              done
            fi
            if [ $(( $(date +%s) - INICIO )) -gt 19500 ]; then
              gh workflow run coleta.yml --ref main -R "$REPO"; exit 0
            fi
            DORME=$(( 60 - ($(date +%s) - T0) )); [ $DORME -gt 0 ] && sleep $DORME   # ciclo de ~1 min (leitura leve: 4 consultas ao portal)
          done
