name: Coleta
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/**", "painel/**", "package.json"]
concurrency:
  group: coleta
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Coletar e publicar
        env:
          PORTAL_CPF: ${{ secrets.PORTAL_CPF }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          SENHA: ${{ secrets.PAINEL_SENHA }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ -z "$PORTAL_CPF" ] || [ -z "$SENHA" ]; then echo "Faltam secrets"; exit 1; fi
          INICIO=$(date +%s)
          hora() { TZ=America/Bahia date +%-H; }
          publicar() {
            rm -rf pub && mkdir pub && node painel/cifrar.js saida/dados.json pub/dados.enc || return 1
            (cd pub && git init -q -b dados && git config user.name "bacetto" && git config user.email "bacetto@users.noreply.github.com" \
              && git add dados.enc && git commit -qm "dados $(date -u +%FT%TZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" dados)
          }
          while :; do
            T0=$(date +%s); h=$(hora)
            if [ "$h" -ge 7 ] && [ "$h" -lt 22 ]; then
              for t in 1 2 3; do
                rm -f saida/dados.json
                timeout 600 node painel/coletar.js && [ -s saida/dados.json ] && publicar && { echo "publicado $(TZ=America/Bahia date +%H:%M)"; break; }
                echo "tentativa $t falhou"; sleep 30
              done
            fi
            if [ $(( $(date +%s) - INICIO )) -gt 19500 ]; then
              gh workflow run coleta.yml --ref main -R "$REPO"; exit 0
            fi
            DORME=$(( 300 - ($(date +%s) - T0) )); [ $DORME -gt 0 ] && sleep $DORME
          done
