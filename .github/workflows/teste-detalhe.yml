name: Conferência estado do robô (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: { run: { working-directory: relatorios } }
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node -e 'Promise.all([import("./src/aprovacao/estado.js"),import("./src/aprovacao/regras.js")]).then(async ([s,r]) => { const e = await s.carregar(); console.log("✅ ajuste:", (e.ajustes||[]).includes("2026-11-25-dserv27")); for (const l of r.textoRegras(e).split("\n")) console.log("✅", l); })'
