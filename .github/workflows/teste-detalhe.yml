name: Teste leads/detalhe (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: { run: { working-directory: relatorios } }
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node -e '
          Promise.all([import("./src/aprovacao/painel-snap.js"), import("./src/aprovacao/boletim.js")]).then(async ([s, b]) => {
            const dia = new Date(Date.now() - 3*3600e3).toISOString().slice(0,10), at = (h) => Date.parse(`${dia}T${String(h).padStart(2,"0")}:00:30-03:00`);
            const d = await s.detalheLojas(at(13), dia); console.log(`✅ detalhe 13h (paginação): publicação ${new Date(d.em-3*3600e3).toISOString().slice(11,19)}`);
            for (const [x,y] of [[9,12],[12,15]]) {
              const [a,g] = await Promise.all([s.leadsLojas(at(x), dia), s.leadsLojas(at(y), dia)]);
              const neg = Object.keys(g.contatos).filter(n => (g.contatos[n]||0) < (a.contatos[n]||0)).length;
              const t = b.textoLeads(a.contatos, g.contatos, g.abertas, y);
              console.log(`✅ leads ${x}h-${y}h: ${Object.keys(g.abertas).length} lojas abertas · ${(t.match(/^•/gm)||[]).length} abaixo de 3 · ${neg} lojas com contagem que diminuiu`);
            }
          }).catch(e => { console.log("❌", e.message); process.exit(1); });'
