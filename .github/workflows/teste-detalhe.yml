name: Conferência estado do robô (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: { run: { working-directory: relatorios } }
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node -e 'import("./src/aprovacao/estado.js").then(async ({ carregar }) => { const e = await carregar(); console.log("✅ enviado:", (e.ajustes||[]).includes("agora-2026-11-24-dia")); })'
