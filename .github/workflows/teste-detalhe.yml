name: Teste detalhe das lojas (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: { run: { working-directory: relatorios } }
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node -e '
          import("./src/aprovacao/painel-snap.js").then(async ({ detalheLojas }) => {
            const dia = new Date(Date.now() - 3*3600e3).toISOString().slice(0,10);
            for (const hh of [13, 15]) {
              const s = await detalheLojas(Date.parse(`${dia}T${hh}:01:00-03:00`), dia);
              const l = Object.values(s.lojas);
              console.log(`✅ ${hh}h: publicação das ${new Date(s.em - 3*3600e3).toISOString().slice(11,19)} · ${l.length} lojas · ${l.filter(x=>x.p>0).length} com pedido · ${l.filter(x=>x.d>0).length} com devolução`);
            }
          }).catch(e => { console.log("❌", e.message); process.exit(1); });'
