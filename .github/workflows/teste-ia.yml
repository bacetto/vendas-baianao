name: Teste IA
on: workflow_dispatch
permissions:
  models: read
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          SENHA: ${{ secrets.PAINEL_SENHA }}
        run: |
          mkdir -p saida
          curl -s "https://raw.githubusercontent.com/${{ github.repository }}/dados/dados.enc" -o atual.enc
          node -e '
            const fs=require("fs"),c=require("crypto"),z=require("zlib");const e=JSON.parse(fs.readFileSync("atual.enc"));const b=Buffer.from(e.dados,"base64");
            const k=c.pbkdf2Sync(process.env.SENHA,Buffer.from(e.salt,"base64"),e.iter,32,"sha256");const d=c.createDecipheriv("aes-256-gcm",k,Buffer.from(e.iv,"base64"));d.setAuthTag(b.subarray(-16));
            fs.writeFileSync("saida/d.json",z.gunzipSync(Buffer.concat([d.update(b.subarray(0,-16)),d.final()])));'
          node --input-type=module -e '
            import fs from "node:fs"; import { analiseIA } from "./painel/ia.mjs";
            const D=JSON.parse(fs.readFileSync("saida/d.json")); const r=await analiseIA(D);
            fs.writeFileSync("saida/ia.json",JSON.stringify(r||{erro:true})); console.log(r?"✅ IA respondeu":"❌ sem resposta");'
          node painel/cifrar.js saida/ia.json ia-teste.enc
          git config user.name bacetto && git config user.email bacetto@users.noreply.github.com
          git checkout -q --orphan teste-ia && git rm -rqf --cached . && git add ia-teste.enc && git commit -qm teste && git push -qf origin teste-ia
