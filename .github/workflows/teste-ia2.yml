name: Teste IA 2
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -i https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Diga apenas a palavra banana"}],"max_tokens":10}' | head -c 1500 | sed 's/^/RES /'
          echo; curl -s https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" | head -c 300 | sed 's/^/CAT /'
