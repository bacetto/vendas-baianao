name: Teste IA 2
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B='{"model":"MODEL","messages":[{"role":"user","content":"Diga apenas a palavra banana"}],"max_tokens":10}'
          for url in https://models.github.ai/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            for m in openai/gpt-4.1 gpt-4.1 gpt-4o-mini; do
              code=$(curl -s -o r.json -w "%{http_code}" "$url" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d "${B/MODEL/$m}")
              echo "RES $url $m -> $code $(head -c 220 r.json | tr -d '\n')"
            done
          done
